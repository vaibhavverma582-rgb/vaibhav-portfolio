<!DOCTYPE html>
<html lang="en" data-theme="light" data-page="gallery">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=38">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Vaibhav Verma",

<body class="loading">
  <main>
    <section id="gallery" class="section gallery-section">
      <div class="container gallery-heading">
        <div class="section-head reveal">
          <span class="sec-kicker">06 · Moments</span>
          <h2 class="sec-title">Research, Fieldwork <span class="amp">&amp;</span> Academic Moments</h2>
          <span class="sec-line"></span>
        </div>
      </div>
      <div class="gallery-block">
        <h3 class="marquee-label reveal">Conferences &amp; Academic Life</h3>
        <div class="marquee-shell gallery-marquee-shell">
          <button class="marquee-arrow marquee-arrow--prev" type="button" aria-label="Scroll academic photos left" aria-controls="gallery-marquee-academic">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="gallery-marquee" id="gallery-marquee-academic" role="region" aria-label="Conference and academic photos" aria-describedby="gallery-instructions" tabindex="0">
            <div class="gallery-track">
              <div class="gallery-sequence gallery-grid">
              <figure class="g-item reveal-zoom" style="--d:.05s">
                <img src="assets/gallery-poster.jpg?v=2" alt="Poster presentation at JNU" loading="lazy">
                <figcaption><b>Poster Session</b><span>Int. Conf. on Climate Change &amp; Sustainable Development · JNU · Oct 2025</span></figcaption>
              </figure>
              <figure class="g-item reveal-zoom" style="--d:.1s">
                <img src="assets/gallery-conference-jnu.jpg?v=2" alt="With Dr. Dhananjai Pandey at JNU conference" loading="lazy">
                <figcaption><b>With Dr. Dhananjai Pandey</b><span>Scientist-G, NCPOR Goa · School of Environmental Sciences, JNU</span></figcaption>
              </figure>
              <figure class="g-item reveal-zoom" style="--d:.15s">
                <img src="assets/gallery-moore.jpg?v=2" alt="With Emeritus Prof. Willard S. Moore" loading="lazy">
                <figcaption><b>With Prof. Willard S. Moore</b><span>Emeritus, University of South Carolina, USA</span></figcaption>
              </figure>
              <figure class="g-item reveal-zoom" style="--d:.2s">
                <img src="assets/gallery-ravenshaw.jpg?v=2" alt="Group at Ravenshaw University" loading="lazy">
                <figcaption><b>With Prof. Malini Prava Sethi &amp; peers</b><span>Ravenshaw University, Cuttack</span></figcaption>
              </figure>
              </div>
            </div>
          </div>
          <button class="marquee-arrow marquee-arrow--next" type="button" aria-label="Scroll academic photos right" aria-controls="gallery-marquee-academic">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
      </div>

      <div class="gallery-block">
        <h3 class="marquee-label reveal">Fieldwork &amp; Surveys</h3>
        <div class="marquee-shell gallery-marquee-shell">
          <button class="marquee-arrow marquee-arrow--prev" type="button" aria-label="Scroll fieldwork photos left" aria-controls="gallery-marquee-field">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="gallery-marquee" id="gallery-marquee-field" role="region" aria-label="Fieldwork and survey photos" tabindex="0">
            <div class="gallery-track">
              <div class="gallery-sequence gallery-grid">
              <figure class="g-item reveal-zoom" style="--d:.25s">
                <img src="assets/gallery-plantation.jpg?v=2" alt="Tree plantation drive in Noida" loading="lazy">
                <figcaption><b>Tree Plantation Drive</b><span>Suvidha Foundation initiative · Noida, UP · GPS-tagged</span></figcaption>
              </figure>
              </div>
            </div>
          </div>
          <button class="marquee-arrow marquee-arrow--next" type="button" aria-label="Scroll fieldwork photos right" aria-controls="gallery-marquee-field">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
      </div>
      <p class="gallery-hint" id="gallery-instructions">Swipe or use arrow keys to explore; select a photo to view it full size.</p>
    </section>
  </main>
  <script src="js/layout.js?v=1"></script>
  <script src="js/script.js?v=25"></script>
</body>
</html>
